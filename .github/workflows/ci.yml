name: QERLIO Runtime CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-suite:
    name: Python Conformance & Integrity Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Full Test Suite
        run: |
          python -m pytest tests/ -v

  native-core-build:
    name: C++20 Core Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build QERLIO Core
        run: cmake --build build --config Release

      - name: Run C++ Core Safety Tests
        run: ctest --test-dir build -C Release --output-on-failure

  cpp-sanitizers:
    name: C++20 AddressSanitizer & UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake with ASan & UBSan
        run: cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DQERLIO_BUILD_TESTS=ON -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic" -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wall -Wextra -Wpedantic"

      - name: Build C++ Safety Test Binary
        run: cmake --build build-asan --target qerlio_cpp_safety_test

      - name: Run T10 Memory Safety Suite under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure
